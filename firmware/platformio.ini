; TT-Coach bring-up firmware. Build: pio run   Test: pio test -e native
; Arduino-ESP32 core 3.x needs the community pioarduino platform.
; Pin the platform URL to a fixed release once a build has succeeded on your machine.

[platformio]
default_envs = m5stick

[env:m5stick]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c
; The m5stick-c board file names a variant that core 3.x no longer ships.
; m5stack_stickc_plus2 is the StickC Plus2 (ESP32-PICO-V3-02).
board_build.variant = m5stack_stickc_plus2
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Isrc
