; TT-Coach firmware. Build: pio run -e m5stick   Test: pio test -e native
; VERSIONS BELOW ARE UNVERIFIED (written without a PlatformIO install).
; After the first successful build, pin the platform URL to a fixed release.

[platformio]
default_envs = m5stick

[env:m5stick]
; Arduino-ESP32 core 3.x needs the community pioarduino platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c
; The m5stick-c board file names a variant that core 3.x no longer ships.
; m5stack_stickc_plus2 is the StickC Plus2 (ESP32-PICO-V3-02).
board_build.variant = m5stack_stickc_plus2
; Default 1.25 MB app slot is too small (WiFi + WebSockets + M5 libs ~1.3 MB).
; huge_app = 3 MB app, no OTA; fits in 4 MB flash.
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    m5stack/M5StickCPlus2@^1.0.2
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
